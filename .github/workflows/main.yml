name: Rebuild Warp Terminal Package

on:
  schedule:
    # Run every two weeks on Monday at 9:00 AM UTC
    - cron: '0 9 */14 * 1'
  workflow_dispatch: # Allow manual triggering (owner only)

jobs:
  check-and-update:
    runs-on: ubuntu-latest
    # Only allow scheduled runs OR manual runs by repo owner
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.actor == github.repository_owner)
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        
    - name: Install Nix
      uses: cachix/install-nix-action@v22
      with:
        nix_path: nixpkgs=channel:nixos-unstable
        
    - name: Check for Warp Terminal updates
      id: check_update
      run: |
        # Get current version from versions.json
        CURRENT_VERSION=$(jq -r '.darwin.version' pkgs/by-name/wa/warp-terminal/versions.json)
        echo "Current version: $CURRENT_VERSION"
        
        # Check latest version from Warp releases API
        LATEST_VERSION=$(curl -s "https://api.github.com/repos/warpdotdev/Warp/releases/latest" | jq -r '.tag_name' | sed 's/^v//')
        echo "Latest version: $LATEST_VERSION"
        
        # Compare versions
        if [ "$CURRENT_VERSION" != "$LATEST_VERSION" ]; then
          echo "update_needed=true" >> $GITHUB_OUTPUT
          echo "new_version=$LATEST_VERSION" >> $GITHUB_OUTPUT
        else
          echo "update_needed=false" >> $GITHUB_OUTPUT
        fi
        
    - name: Update package if needed
      if: steps.check_update.outputs.update_needed == 'true'
      run: |
        cd pkgs/by-name/wa/warp-terminal
        
        # Make update script executable and run it
        chmod +x update.sh
        ./update.sh
        
    - name: Test build
      if: steps.check_update.outputs.update_needed == 'true'
      run: |
        # Test build the package to ensure it works
        nix-build -A warp-terminal
        
    - name: Create Pull Request
      if: steps.check_update.outputs.update_needed == 'true'
      uses: peter-evans/create-pull-request@v5
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        commit-message: "warp-terminal: update to ${{ steps.check_update.outputs.new_version }}"
        title: "warp-terminal: update to ${{ steps.check_update.outputs.new_version }}"
        body: |
          Automated update of Warp Terminal package.
          
          - Updated from version in versions.json
          - New version: ${{ steps.check_update.outputs.new_version }}
          - Build tested successfully
          - Trigger: ${{ github.event_name == 'schedule' && 'Scheduled' || 'Manual (Owner)' }}
          
          This PR was created automatically by the scheduled rebuild workflow.
        branch: update-warp-terminal-${{ steps.check_update.outputs.new_version }}
        delete-branch: true
