name: Rebuild Warp Terminal Package

on:
  schedule:
    # Run every two weeks on Monday at 9:00 AM UTC
    - cron: '0 9 */14 * 1'
  workflow_dispatch: # Manual trigger (restricted to repo owner in job condition)

jobs:
  rebuild-and-update:
    if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.actor == github.repository_owner) }}
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Install Nix
      uses: cachix/install-nix-action@v22
      with:
        nix_path: nixpkgs=channel:nixos-unstable

    - name: Setup Nix config
      run: |
        mkdir -p ~/.config/nix
        cat > ~/.config/nix/nix.conf <<'EOF'
substituters = https://cache.nixos.org/
trusted-users = root
experimental-features = nix-command flakes
EOF

    - name: Run update.sh
      run: |
        cd pkgs/by-name/wa/warp-terminal
        chmod +x update.sh
        ./update.sh

    - name: Check for changes in versions.json
      id: git_changes
      run: |
        if git diff --quiet pkgs/by-name/wa/warp-terminal/versions.json; then
          echo "update_needed=false" >> $GITHUB_OUTPUT
        else
          echo "update_needed=true" >> $GITHUB_OUTPUT
        fi

    - name: Test build Warp Terminal
      if: steps.git_changes.outputs.update_needed == 'true'
      run: |
        nix-build pkgs/by-name/wa/warp-terminal/package.nix

    - name: Create Pull Request
      if: steps.git_changes.outputs.update_needed == 'true'
      uses: peter-evans/create-pull-request@v5
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        commit-message: "warp-terminal: update"
        title: "warp-terminal: automatic update"
        body: |
          This PR updates Warp Terminal using the repository’s update.sh script.

          - Trigger: ${{ github.event_name == 'schedule' && 'Scheduled' || 'Manual (Owner)' }}
          - Changes were detected in `versions.json`
          
          Build has been tested in CI.
        branch: update-warp-terminal-${{ github.run_number }}
        delete-branch: true
